name: Playwright Tests (Docker)

on:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: E2E (Chromium) - Docker
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aetests .

      - name: Run Playwright tests in container
        run: docker run --rm -v ${{ github.workspace }}/allure-results:/app/allure-results aetests || true

      - name: Generate Allure report in container
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/allure-report:/app/allure-report \
            aetests sh -c "npx allure generate allure-results -o allure-report --clean --single-file"

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-docker-${{ github.run_id }}
          path: allure-report
          retention-days: 14

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-docker-${{ github.run_id }}
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore